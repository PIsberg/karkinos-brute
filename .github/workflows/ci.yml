name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep the load/throughput tests (tests/load.rs) fast in CI. Locally they
  # default to a much larger keyspace for a real stress run; here we just
  # smoke-test the dispatch path end to end.
  LOADTEST_CANDIDATES: "20000"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      # The engine load tests are far more representative of real cracking in
      # release mode (the dispatch hot path is heavily optimized), so run them
      # once more optimized — still on the small CI keyspace via LOADTEST_CANDIDATES.
      - name: Run load tests (release, small keyspace)
        run: cargo test --release --test load -- --nocapture
